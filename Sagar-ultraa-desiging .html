<style>

*{box-sizing:border-box}

.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;background:radial-gradient(circle at 85% 15%,var(--sf),transparent 55%),var(--c);padding:72px max(24px,calc(50% - 536px));min-height:590px;position:relative;isolation:isolate;overflow:hidden}

a.card:hover{transform:translateY(-4px)}

.av{position:relative;overflow:hidden;width:110px;height:110px;border-radius:50%;background:var(--c);display:grid;place-items:center;font:500 1.8rem "Cormorant Garamond",Georgia,serif;margin-bottom:14px}.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
form{display:grid;gap:12px}input,textarea{font:inherit;padding:13px 16px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--ink)}

/* ---------- Motion + content layer ---------- */

@keyframes imgin{from{opacity:0;clip-path:inset(0 0 100% 0 round 18px);transform:translateY(46px)}to{opacity:1;clip-path:inset(0 0 0 0 round 18px);transform:none}}
@keyframes fup{from{opacity:0;transform:translateY(28px)}}
@keyframes pulse{to{transform:scale(1.18) translate(-14px,12px)}}

.hero>div>:not(h1){animation:fup 1.1s cubic-bezier(.16,1,.3,1) backwards}
.hero>div>:nth-child(1){animation-delay:.1s}.hero>div>:nth-child(3){animation-delay:.5s}.hero>div>:nth-child(4){animation-delay:.6s}.hero>div>:nth-child(5){animation-delay:.7s}.hero>div>:nth-child(6){animation-delay:.8s}.hero>div>:nth-child(7){animation-delay:.9s}
.hero>.ph{animation:heroin 1.5s cubic-bezier(.16,1,.3,1) .15s backwards,fl 9s ease-in-out 1.8s infinite}
.sw{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .04em .14em;margin-bottom:-.14em}
.sw>span{display:inline-block;transform:translateY(112%) rotate(4deg);transform-origin:0 100%;animation:wup 1.1s cubic-bezier(.16,1,.3,1) forwards;animation-delay:calc(.12s + var(--i)*.07s)}
@keyframes wup{to{transform:none}}
.pre .hero,.pre .hero *{animation-play-state:paused!important}

.pb{position:fixed;top:0;left:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(var(--sp,0));background:linear-gradient(90deg,var(--ac),#efd29a);z-index:90;pointer-events:none}

.ld.x{opacity:0;visibility:hidden}

.ld .lbar{width:min(220px,50vw);height:2px;background:var(--ln);overflow:hidden;border-radius:2px}
.ld .lbar:after{content:"";display:block;height:100%;background:var(--ac);transform:translateX(-100%);animation:ldbar 1.1s .1s ease-in-out forwards}
@keyframes ldin{from{opacity:0;transform:translateY(24px) scale(.96);filter:blur(8px)}}
@keyframes ldbar{to{transform:none}}
@keyframes ldout{to{opacity:0;visibility:hidden}}
.tr{position:fixed;inset:0;z-index:95;background:var(--dk);color:var(--dt);display:grid;place-items:center;transform:translateY(101%);pointer-events:none}
.tr span{font:italic 500 clamp(2rem,6vw,4rem) "Cormorant Garamond",Georgia,serif;opacity:0;text-align:center;padding:0 20px}
.tr.go{animation:wipe 1s cubic-bezier(.76,0,.24,1) forwards}.tr.go span{animation:wspan 1s ease forwards}
@keyframes wipe{0%{transform:translateY(101%);border-radius:50% 50% 0 0/14% 14% 0 0}42%,58%{transform:none;border-radius:0}100%{transform:translateY(-101%);border-radius:0 0 50% 50%/0 0 14% 14%}}
@keyframes wspan{0%,30%{opacity:0;transform:translateY(20px)}48%,56%{opacity:1;transform:none}75%,100%{opacity:0}}
.cur{position:fixed;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border:1px solid var(--ac);border-radius:50%;pointer-events:none;z-index:99;opacity:0;transition:width .3s,height .3s,margin .3s,background .3s,opacity .3s}
.cur.h{width:72px;height:72px;margin:-36px 0 0 -36px;background:#9a6a351f}

.mqs{padding:0 0 40px;background:var(--bg)}
.mq{overflow:hidden;padding:10px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mq .tk{display:flex;width:max-content;animation:mq 70s linear infinite}.mq.r .tk{animation-direction:reverse;animation-duration:85s}.mq:hover .tk{animation-play-state:paused}
.mq img{flex:none;width:clamp(200px,24vw,320px);height:clamp(150px,18vw,240px);object-fit:cover;border-radius:20px;margin-right:16px;box-shadow:0 10px 30px #12302a14;background:var(--p1);transition:transform .5s}.mq img:hover{transform:scale(1.04) rotate(-.6deg)}
@keyframes mq{to{transform:translateX(-50%)}}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:28px}
.st b{display:block;font:500 clamp(2.8rem,6vw,4.6rem)/1 "Cormorant Garamond",Georgia,serif;color:var(--dt);margin-bottom:8px}.st p{margin:0;font-size:.92rem}

.ba{position:relative;aspect-ratio:4/3;margin:0;border-radius:22px;overflow:hidden;background:var(--p1);box-shadow:0 18px 45px #12302a18;touch-action:pan-y}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.ba .a{clip-path:inset(0 calc(100% - var(--p)) 0 0)}
.ba .hn{position:absolute;top:0;bottom:0;left:var(--p);width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 18px #0005;pointer-events:none}
.ba .hn:after{content:"↔";position:absolute;top:50%;left:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:#fffdf8;color:var(--dk);display:grid;place-items:center;font:500 1.1rem Manrope,sans-serif;box-shadow:0 8px 24px #0003}
.ba input{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;opacity:0;cursor:ew-resize;touch-action:pan-y}

.ba.go{animation:sweep 2.6s .3s ease-in-out}
@keyframes sweep{0%{--p:50%}30%{--p:12%}70%{--p:88%}100%{--p:50%}}

.gal{columns:3 250px;column-gap:14px}
.gal figure{margin:0 0 14px;min-height:140px;break-inside:avoid;border-radius:18px;overflow:hidden;cursor:zoom-in;background:var(--p1);box-shadow:0 10px 30px #12302a10}
.gal img{display:block;width:100%;height:auto;filter:saturate(.9);transition:transform .9s cubic-bezier(.2,.7,.2,1),filter .6s}.gal figure:hover img{transform:scale(1.06);filter:saturate(1.08)}
.lb{position:fixed;inset:0;z-index:98;background:#102a24ee;backdrop-filter:blur(10px);display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}.lb.on{opacity:1;visibility:visible}
.lb img{max-width:min(92vw,1100px);max-height:86vh;border-radius:16px;transform:scale(.92);transition:transform .5s cubic-bezier(.16,1,.3,1);box-shadow:0 30px 80px #0006}.lb.on img{transform:none}
.lb button{position:absolute;background:#ffffff1f;color:#fff;border:0;width:48px;height:48px;border-radius:50%;font-size:1.6rem;cursor:pointer;transition:background .25s}.lb button:hover{background:#ffffff40}
.lb-x{top:20px;right:20px}.lb-p{left:20px;top:50%;margin-top:-24px}.lb-n{right:20px;top:50%;margin-top:-24px}

.fq{background:var(--sf);border:1px solid var(--ln);border-radius:18px;margin-bottom:12px;overflow:hidden;transition:box-shadow .3s}

.map{border-radius:22px;overflow:hidden;aspect-ratio:16/7;min-height:260px;box-shadow:0 18px 45px #12302a18}.map iframe{width:100%;height:100%;border:0;filter:saturate(.7)}

@media(max-width:940px){.bt{display:block}nav{display:none;position:absolute;top:100%;left:0;right:0;background:var(--bg);flex-direction:column;align-items:flex-start;padding:16px 24px;max-height:75vh;overflow:auto;border-bottom:1px solid var(--ln);gap:12px}body.o nav{display:flex}.sub{display:block;position:static;border:0;box-shadow:none;background:none;padding:0 0 0 8px}.sub a{padding:7px 10px}.hero,.row{grid-template-columns:1fr}.hero{min-height:auto;padding-top:54px;padding-bottom:54px}.hero .ph{min-height:260px;aspect-ratio:16/10;border-radius:22px}.row.rev>:first-child{order:0}.w{padding:58px 20px}.map{aspect-ratio:4/3}}

/* flipbook */
.fb{height:560vh;position:relative;background:radial-gradient(ellipse at 50% 42%,#1f4a3f,var(--dk) 72%)}
.fbs{position:sticky;top:calc(76px + env(safe-area-inset-top,0px));height:calc(100vh - 76px);height:calc(100svh - 76px - env(safe-area-inset-top,0px));display:grid;place-items:center;perspective:1900px;overflow:hidden}
.fbh{position:absolute;top:20px;left:0;right:0;text-align:center;opacity:calc(1 - var(--o,0)*1.5);pointer-events:none;color:var(--dt)}.fbh h2,.fbh p{margin:0 0 .3em;color:var(--dt)}
.bk{--W:min(300px,46vw);position:relative;z-index:2;width:var(--W);height:calc(var(--W)*1.4);margin-top:44px;transform-style:preserve-3d;will-change:transform;transform:translateX(calc(var(--o,0)*var(--W)/2)) translateY(calc((1 - var(--s,0))*17vh)) scale(calc(.8 + var(--s,0)*.2)) rotateX(calc((1 - var(--s,0))*68deg + 5deg*(1 - var(--o,0)) + var(--my,0)*-3deg*var(--s,0))) rotateZ(calc((1 - var(--s,0))*-24deg)) rotateY(calc(-13deg*(1 - var(--o,0))*var(--s,0) + var(--mx,0)*5deg*var(--s,0)))}

.bk:before{background:#e9dcc0;transform:translateZ(-4px)}.bk:after{background:#b9a77f;transform:translateZ(-9px)}
.bsh{position:absolute;inset:-6% -10% -10% -6%;border-radius:50%;background:radial-gradient(closest-side,#000d,#0000);filter:blur(16px);transform:translateZ(-14px);opacity:calc((1 - var(--s,0))*.9);pointer-events:none}
/* room + table backdrop */
.rm{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:
radial-gradient(ellipse 55% 60% at 22% 18%,#ffe9b0cc,#ffd98a44 45%,#0000 75%),
radial-gradient(circle at 78% 22%,#c9e0a055 0 7%,#0000 9%),radial-gradient(circle at 64% 12%,#ffe7a066 0 5%,#0000 6.5%),
radial-gradient(circle at 88% 40%,#d7ecb255 0 9%,#0000 11%),radial-gradient(circle at 48% 34%,#fff1c744 0 4%,#0000 5.5%),
radial-gradient(circle at 10% 44%,#ffffff33 0 6%,#0000 8%),
linear-gradient(180deg,#5b4a33 0%,#33291e 55%,#1d1610 100%)}

const COV=[["Acrylic-Crystal cover pad","In this new generation of acrylic covers, the highest technologies provide smooth, pure, crystal like materials to offer you extraordinary options. Acrylic professional wedding albums have a very unique look. The cover photo is mounted in crystal clear acrylic for a glassy look. The sides are finely tapered and edges slightly rounded. Finally, with diamond polishing, it contributes to even more precious and exclusive results. The back and spine are leatherette, normally in black, or color of your choice. Rounded Spine with Italic binding gives a marvelous look to the album. No wonder these cover pads are highly in demand worldwide amongst all other options.","2023/01/1-768x768.jpg"],
["Canvas covers","Our canvas cover pads are printed on the finest canvas in the market. This premium-grade canvas ensures there are no color shift issues. Our canvas is a bright white, consistent poly-cotton blend canvas. It has all the beautiful texture of canvas while maintaining image detail – capturing every nuance in your images with its incredible image resolution. Protective varnish coating: our processes and systems are designed to ensure that our canvases are of the highest quality. We coat our canvas prints with a varnish to protect the print from moisture, abrasion and UV damage.","2023/01/UA1-7-768x512.jpg"],
["Linen cover pad","Linen is fine collection of Fabric, thick enough to resist wear. It gives very pleasant look to the covers. Text like Bride – Groom’s Names can be printed directly over it.","2023/01/14-768x512.jpg"],
["Leather cover pad","We have full wrap Leather cover pad, with/without cameo. Colours can be as you choose. Add a finishing touch with a personal message and/or logo onto your wedding album. We offer 3 different imprinting styles: Laser Engraving, Silver/Gold Foil stamping, and UV printing.","2023/01/6-2-768x784.jpg"],
["Photo cover pad","Personalised cover pad with a beautiful photo is presented on hard cover. Name and dates as well as other branding can also be done on the picture. We do matt lamination to prevent damage due to long usage. We offer full wrap option also to have elegant looks.","2023/01/7-2-768x576.jpg"],
["Metal cover pads","Silver plate with matt brush finish is printed with couple photo or couple names. It gives a beautiful metallic look to the image.","2023/01/Metalic-1-768x444.jpg"],
["Wooden cover pads","Those who are wood lovers find this type to suit them. Album with wood case is a stunning combination. Text and other designs can either be laser engraved or embossed.","2023/01/8b5ff1d7-b701-4b8b-aae7-ca7730f89f2b-1024x768.jpg"],
["Embossed covers","Raised embossing: forget old-days debossing of names on covers. Latest machinery helps us make texts and titles with an emboss effect, raised above the surface, in any colour shade. Gold / Silver embossing: text can be written in shining Gold, Rose gold or Silver foil. This is the latest trend nowadays. These covers are available in Leather, Canvas, Metal, Wood and Linen material types.","2023/01/87c0873e-b7a2-41d8-91ca-bb4a1554e11f-1024x768.jpg"]];

"our-products":{t:"Our Products",p:["Hand-bound albums, photo books and packaging — made in Mumbai, shipped worldwide."],g:[["Flush Mount Albums","flush-mount-album","Flush Mount Album is the quintessential wedding and celebration album for the moments that change your life. Enjoy exceptional print quality of your choice."],["Lay Flat Albums","layflat","Spread your memories wide open with our Layflat Albums. Forget folded photos and hidden scenes. Showcase your stunning panoramas across two seamless pages with these albums lay flat. Dive right into every moment, rediscover forgotten details, and experience your stories like never before. Ready to bring your memories to life? Start exploring Layflat Albums today."],["Luxury Albums","luxury-albums","Ultraa Albums luxury custom photo albums are designed to your taste, adding an elegant touch to your photos and albums."],["Photo Book","photo-book","Photo Books can be used to treasure precious moments from your child’s birth to his/her high school graduation. If you carry a penchant for the photography art, Photo Books can be used for exhibiting your work to others."],["Box & Bags","box-and-bags","Refined over the years, our regular box has been a popular feature of our range. It is a modern way of packaging. It combines two elements: a designer hard wooden structure frame wrapped in a leatherette material, and a beautiful photo on the top cover."],["Slip in Albums","slip-in-albums","Slip-in album is the best option to showcase your precious photos. Carefully handcrafted, this album is perfect for capturing and preserving all your memories."]]},
"flush-mount-album":{t:"Flush Mount Albums",p:["Keep your memories alive with a flush mount albums. It’s the perfect way to cherish those special moments forever. Ultraa Albums creates all of our albums HAND BOUND. Our album pages aren’t solely relying on glue to secure them in, they are relying on book binding techniques that were used years ago when individual books were made by hand.","When comparing our album to a machine-made flush mount album, you can expect that the hand of a skilled artisan who uses superior materials will offer a more precise fit and a longer album life. This craftsmanship and the time invested to create an heirloom is why our albums cost more than those produced by a machine. That’s also the reason why we are able to offer a larger variety of cover options; from leather to fabric or acrylic covers and add-on options like cut-out windows. We also offer a leather bound with magazine cover. And for these reasons we are proud to offer a 100% quality guarantee."],q:"Expensive flush-mount wedding albums are now affordable for everyone and every occasion.",s:[["Binding – Panoramic Spreads","Our flush mount albums are hand-bound with Silver halide prints and a thick white/Black substrate in between. This gives a crispy, straight panoramic view of entire spread."],["Page Thickness","The difference between a cheap photo book and a high quality flush mount album. Our thick archival board is 0.5mm-1mm thick. Prints are of 0.5 mm and final page thickness is 1mm as standard and 1.5 mm for extra thick pages, and is guaranteed to allow your album to withstand the wear and tear of everyday viewing."],["Professional Photo Paper","Our flush mount albums are printed on Fuji Crystal Archive silver halide photo paper with luster finish to allow for excellent image stability, pure clean whites, and most importantly, accurate color reproduction."]],lt:"Important features of our range",l:["Variety of creative designs — NOT the template type ones","Page laminations: UV, thermal matt, high gloss, velvet, silk","Covers: photo, acrylic, metal, canvas, linen and leather"],cl:"The covers – the story starts from here. Creating the cover is one of the most exciting moments in the album design process. Ultraa Albums have always offered richness of materials and customizations. In order to give it a uniqueness, our covers are all handmade, with aesthetical sensibility. The combination of the material, color and technology is essential: the leathers, the canvas, the metals or the linens, to name but a few, selected in the preferred tones. The spine and back, which enrich the front cover, can be chosen to match the front cover. Text and other designs can be embossed, printed or Gold/Silver foil embossed.",cov:1},
"layflat":{t:"Premium Layflat Albums",p:["Our Layflat Albums are very similar to our Flush Mount Album except the substrate is thinner and lighter in weight, which allows more pages and is more economical. It’s a lighter flush mount album in weight."],s:[["Panoramic Lay flat Pages","It contains stunning 2-page spread. No bulging, no gutter at the center of page. These books are printed on rich, high-density colors, via pro lab photo printing.<br><br>In this digital age, it’s easy to see a picture once on your phone or laptop, forget it and never look at it again. There are some moments you have lived with your loved ones, spent your precious time together, shared all the bitter funny jokes — those smiles and invaluable memories deserve only the best. Our premium lay flat photo books are perfect for showcasing and preserving your favourite moments.<br><br>They are ideal for panoramic images and known for their exceptional viewing experience. The great thing about the Lay Flat is that you can print an image across a double page spread without worrying the fold of the photo book interrupts your image. Whether it’s travel memories, your wedding, a big celebration, your child’s first birthday, a family trip, an outing with friends, or a bachelor party, your precious moments will be preserved forever."],["Layflat Photo Books","Lay flat photo books also make for professional portfolios. Interior designers, fashion designers, makeup artists, photographers and all those professionals who show out their designs — lay flat photo books do justice to your beautiful designs and art. It acts as a cherry on the cake for your work and increases the chances for you to stand apart from the rest of the crowd and impress your clients.<br><br>And that’s how these albums also are a great gift for your friends and families who are in such a profession."],["Layflat Albums","How beautifully open or closed. Our hand-bound albums are made of quality materials, beautifully designed and made to last. They are a wonderful way to preserve your precious memories and as a gift to somebody you adore and you want them to remember you forever.<br><br>Using traditional bookbinding techniques, our photo albums are made to lie completely flat, and your panoramic images can be printed seamlessly on a double page spread and will look absolutely stunning. Your images will spread elegantly on your coffee table, enhancing your experience in a way that other binding techniques cannot. Relive your most important memories in one of our exquisite lay-flat albums."]],cov:1},
"photo-book":{t:"Photo Book",p:["Photo Books can be used to treasure precious moments from your child’s birth to his/her high school graduation. If you carry a penchant for the photography art, Photo Books can be used for exhibiting your work to others. We are a Photo Books Manufacturer and counted amongst the leading Photo Albums Books Suppliers."],s:[["Regular Photo books","You can now make cheap photo books for memorable photos from Facebook, WhatsApp, Instagram and mobile phones with good quality cameras."],["Wedding Photobook Album","We provide you classical type of modern photo books. We have non-tearable paper printed with glossy, matt and feather touch finish. Our speciality is full flat openable books, no curved pages from center."],["Styles & sizes","Photo Books provided by us are available in variety of styles and sizes. Customers can buy Photo Books ranging from really inexpensive Photo Books to coffee table style Photo Books with hardcover. Our Photo Books are available in 6×8 and 9×12 sizes. Customers can also place order for wedding books having 12×18 size."],["Our Photo Books","Our Photo Books are known for excellent design and quality workmanship. These are made from finest material. The printed cover can also be easily laminated and a high quality finish could be achieved. On the cover of the book, one can get the designs and photos printed. All our books come with standard binding and look like a hardcover book of bookstore quality."],["Mini & print books","Mini Photo Books are suited for the needs of office, school and college goers. One can use ones mobile phone or camera for presenting memories. The books look like pocket type book of 5×5 size. We give the option of print books to our customers too. Photos can be printed in 4×6, 5×7 or 6×8 sizes, with a personalized cover. Our print books are also not very expensive.<br><br>Are you looking for a reliable Photo Album Maker India? Your search ends here! We also provide Professional Wedding Photo Albums."]],cov:1},
"luxury-albums":{t:"Luxury Album Maker",p:["We may have digital screens of mobiles and laptops everywhere with functions like “pinch to zoom” and so on, but we still can not deny the magic of prints. Some memories are like a gold mine that only comes around once in a blue moon. We make best luxury. You can contact us for every function’s albums — whether it’s your wedding, your child’s first birthday, your parents’ golden anniversary, or literally anything you consider precious that deserves a luxurious and safe place, you can count on us."],s:[["Premium Photo Album","We make luxury albums in such a way that keeps all your elegant and precious moments safe. This way, when you look back years from now, you’ll still feel like you are reliving the moment. We use beautiful handcrafted leather and a wooden casket to make these luxury albums. The casket and album can be personalised with the person’s name in a luxurious font. Printing your photos on flat, flush mounted pages gives your album a luxurious and elegant look.<br><br>We customize luxurious albums as per your wish. You say it and we present it. Choosing from the album cover — be it acrylic, leather, hardcover, linen, wood, canvas — to colour, design and layout, everything is possible."]],cov:1},
"box-and-bags":{t:"Box and Bags",p:["Refined over the years, our regular box has been a popular feature of our range. It is a modern way of packaging. It combines two elements: a designer hard wooden structure frame wrapped in a leatherette material, and a beautiful photo on the top cover. See the variety of options available."],lt:"The cover can have",l:["Full photo wrap","Acrylic strip","Photo in a window – cameo","Full leather wrap with couple name or title (printed or embossed)","Combination of any of above"],s:[["Box with carry options","A heavy album in the box is often difficult to carry to some place. For this, a handle option to carry like a suitcase or like a ladies’ purse is also available."],["Carry Cases and Display Boxes","Display Boxes are available as an optional extra for album formats 10×10 and larger, in Pearl or Carbon Buckram. They are similar in construction to our Premium Boxes. Carry Cases are available for album formats 12×12 and larger. They’re offered in a durable black fabric with a practical carry handle.<br><br>Please specify your packaging choice when you place your order. Unless you choose to upgrade, albums are presented in our standard soft leather bag. These products cannot be purchased independently."]]},
"slip-in-albums":{t:"Slip in Album",p:["We are engaged in providing a wide range of inexpensive photo albums. Most of us have loose prints just lying in our houses, or some old albums torn apart over a years’ time. When we see them, we cherish our old memories. Our inexpensive albums are the best way to hold them in a proper way.","We use only photo safe, dimpled surface polypropylene (moisture proof) pockets, so that photographs can last a long time. Slip in Albums come with PVC white pockets and up to 300 photo capacity. The cover is leather in any colour you desire, or full wrap photo cover."],s:[["Low Cost Gift Albums","Photo labs can give these albums along with loose print orders as a gift album. The cover is printed with lab details, so gifting an album is a good means of your advertisement. We also use ultrasonic sealing machines for securing plastic pockets to covers.<br><br>Customers can place order for any quantity of Low Cost Gift Albums with us. We deliver orders within the stipulated time frame. Our Low Cost Gift Albums are of superior quality and we have never received any complaints from customers regarding the quality of the albums provided by us. We check the photo albums thoroughly in the quality testing units before dispatching."],["Perfect for every occasion","The slip in album is one of the most popular types of albums. It is relatively inexpensive and ideal for many occasions. You do not need glue to stick the photos in, and you do not need to fix the pictures in any other way — just have your photos printed and insert them. Once inserted, you will have enough space to label the photos or implement other design ideas. In slip-in albums your photos are safely stored. Perfect for college trip, bachelor party, wedding photos, baby shower gifts, birthday photo albums and more. Personalized slip-in photo album for 200–500 4×6 in (10×15 cm), 2–4 photos per page."]]},
"image-editing":{t:"Image Editing Services",p:["Ultraa Albums is 10+ years young organization working for different companies across the globe. Image correction & enhancement services at Ultraa Album can digitally restore and enhance the quality of poor images. Images can be repaired, retouched, copied, enhanced or resized, all without harming the original print. Our skilled artists will take utmost care of every detail in your photo and faithfully restore it to excellent condition."],lt:"Our photo retouching services include",l:["Advanced image cutouts / clipping paths","Balancing brightness / contrast","Repair of scratches, creases, minor dust and spot removal","Light and color corrections","Beauty / Glamour Retouching","Object Removal","E-Commerce Editing","Video Editing"],s:[["Free sample","If you want to test our quality of work please send us one/two raw files with instruction and we will work for free. You can send the image as an attachment or we transfer. Our work will speak for itself."],["Experience","Our designers possess more than 10 years of experience and expertise in image editing tools like Lightroom & Photoshop. We provide the highest levels of responsive service, creating great value in technology, communication, and manpower. Fired by a passion for business excellence and driven by sound human values, Ultraa Albums continues to grow based on its capabilities. We deliver on our commitments."]],ba:1,nogal:1},
"photo-editing-and-album-design":{t:"Photo Editing Work",p:["Every moment or every occasion you celebrate is a beautiful memory. So should not the pictures you click and edit also be a masterpiece? When you look at your memories after years, you feel refreshed and remember the beautiful moments again.","Ultraa Albums is one of the leading photo editing companies in Mumbai. We have carved a niche for photo editing, beauty retouching, adding effects, removing blemishes, colour correction, and changing background. We have years of experience and are highly trained to provide these services."],s:[["Photo Clipping Path Service","With our clipping path service, we carefully extract objects, people, or any other point from an image into focal points. Regardless of your business model or family occasion, you can rest easy knowing you have us."],["Old Photo Restoration Service","Photos fade and deteriorate over the years. Surely you too have some pictures from your grandparents’ or parents’ time that have faded. We have years of experience in restoring these pictures to keep your memories safe and longer."],["Background Removal Service","We offer a background removal service that allows you to highlight the subject of your photo and create a transparent background so you can place your new image in a variety of new designs and destinations."],["Photo Retouching Service","We remove all imperfections from a photo, which usually includes colour and tone correction, removing blemishes and dark circles, changing brightness, shadow contrast and saturation."],["Why Ultraa Albums","We believe a part of good creative retouching and editing is a thorough understanding of the style and type of editing. For this reason, we are always one step ahead when it comes to delivering the best quality. We are highly skilled and professional at removing any negative part of the photo that you do not need. Our work is flawless, intact, elegant and catches everyone’s attention. In the 15+ years we have been in business, we have served a wide variety of clients, and we are still adding more. We have a top-notch pool of experienced Photoshop professionals, hand-crafted artists, and soft masking experts to ensure that every image they go through looks its best and meets the clients’ goals exactly. With our proven process, we have a very fast turnaround time. Simply send us your images to be processed with the details of how you want them and leave the rest to us."],["How we work","We offer amazing value for money without compromising on quality. As soon as the photographer or our client gives us the pictures, we talk to our clients on the phone and clarify the requirements: the type of edits they want, the type of layout they want to keep, the type of paper they want to use, the material of the album cover, the number of images per page, the finish of the photos, the design of the album, the type of font they want to use, and every detail related to the album to be printed and how it should look. Once the photo editing is done, we share it with our clients via email or WhatsApp and make any necessary changes. We also get approval for the design and layout of the album. Once everything is finalized, we get the pictures printed on the desired paper and bind them into the album."]],ba:1,nogal:1},
"photography":{t:"Wedding Photography Services",p:["We help people better their wedding experience with great videography and photography services. We travel across the country creating an incredible montage of the most priceless moments of the weddings we cover. We have a team of 15+ skilled photographers and videographers.","Together with the essential formal portraits of your wedding party, family and friends, you will receive a complete collection of images capturing the signature moments of your day. Enjoy your day knowing that your wedding story will be documented as an artistic statement as totally unique as you! We are fortunate to count many of our clients as lifelong friends and look forward to each wedding as a privilege and honor as being part of one of the most important days of your lives."],s:[["Candid & traditional","While candid wedding photography is our forte, we also do save-the-date, engagement, pre and post wedding shoots and of course, traditional photography. We also cover wedding video in Traditional and cinematic styles with multiple angles."],["Beyond weddings","We also photograph proposals, bar and bat mitzvahs, special events, and outdoor family portraits. We offer specially designed packages for every need and budget — we will show sample pictures and video highlights during a meeting — and we also provide wedding photo albums."],["Response time","We will respond to your inquiry via email and/or a phone call within 24 hours unless photographing a wedding or on holiday. Then, it may take an additional day to get back to you."]]},
"album-designing":{t:"Professional Album Designs",p:["Most album designing and manufacturing companies offer free software to download from their site and claim that you can design your album yourself. It takes days to understand how the software works, and there is no theme or album design template in that software — no creativity in design, just flat placement of photos on a page.","Ultraa Albums has a team of experienced professional wedding photo album designers. Our professional designers make designs as per your likings. We have about 6 to 7 album designing themes to choose from. We always show you a soft copy preview for corrections/approval, and we give unlimited revisions until you are satisfied. Yes, it is unbelievable, but true: the album designing service we offer is free to you."],cg:[["Album Design Video Samples",["Classic Design","Clean Design","Contemporary Design","Indian Design","Indian Classic Design","Indian Fusion Design"]],["Ultraa Album Designs",["Elegant Design","Western Design","Clean Design","Classic Design","Indian Fusion Style","Baby Album Design","Modern Design","Indian Classic Design","Album Design","Album 2 Design"]]],s:[["Why a designer?","Making the best album design is difficult for many photographers and artists, and it becomes unprofitable for them to do everything themselves. Album design is the activity that occupies an enormous amount of time and effort. To solve this problem we at Ultraa Albums have experienced album designers — experts who can design every type of album. Contact us for the best album designing service, because we are one of the best album manufacturers in Mumbai."]],ext:["See wedding album designs","album-designs"]},
"album-designs":{t:"Wedding Album Designs",p:["The team of Ultraa Albums know how important and valuable a wedding ceremony is in anyone’s life. In fact, any occasion that is celebrated with your loved ones. It could be a family outing, a corporate event, your graduation, school memories, a birthday or a baby shower.","The beautiful moments, the joy and fun shared with your family and loved ones, the giggles, the games, the music and food — all these precious moments are captured and stored somewhere. And nothing is as precious as an album. Even though it’s the era of the digital world, we cannot deny the tinge of prints when it comes to albums. Because in the end, that’s your treasure trove of memories."],h:`<p>There you can see your best moments years later and live in that moment, those feelings are priceless. That’s why at Ultraa Albums, we design best wedding photo albums from scratch in the exact style you envision. Our experienced album designers know how to create brilliant, engaging designs that reflect the memory being stored in the album. We have experienced designers for both Indian wedding albums or Western wedding albums. We are open to any theme or design you suggest.</p><p>If you do not have a specific design in mind for your wedding album, you have come to the right place. Our expert designers will advise you and help you choose the theme, layouts, designs and materials that suit your style and budget. Take advantage of Ultraa Albums and add a personal touch to your wedding memories. We offer all kinds of services related to album design, you name it, we do it.</p><p>With an extremely talented team of album designers, we play with the right colours and the different types of displays to make it attractive, beautiful and free from clutter and colour issues. Our in-house album designers make all the necessary changes and share them with you at every stage to ensure you get a top-notch photo book.</p>`,gg:[["Check Our Wedding Album Designs","Indian wedding classic design",A21],["Western Wedding Album Design","Western classic album design",A20]],nogal:1},
"wedding-photo-albums":{t:"Wedding Photo Albums and Books",p:[`Ultraa Albums appreciates the significance of preserving your wedding memories. A wedding memory is a way to preserve the joy, love, and special moments that were captured on that day for future generations. You can pass down these precious memories to your grandchildren as a cherished family heirloom, ensuring a lasting legacy for generations to come. For this reason, we offer a full range of meticulously designed wedding photo albums and wedding photo books to perfectly capture the magic of the special day. No matter what style of marriage album design you want, we have it all: Flush Mounts, Lay Flats, or a dedicated album for your wedding photos. The products we offer are carefully selected to make sure that you can revisit those memorable moments for years to come.`],s:[[`Flush Mount Albums for Wedding Photo Albums`,`We hand-bind our wedding photo albums with silver halide prints between substantial white and black substrates to give you a seamless panoramic view. We use thick archival board that measures between 0.5mm and 1mm, which distinguishes our flush mount albums from affordable photobook suppliers. They are created using Fuji Crystal Archive silver halide photo paper, ensuring excellent image stability, pristine whites, and accurate color reproduction. The substantial thickness of the board ensures that the albums can withstand the test of time, protecting your cherished memories for years to come.<br><br>${a("Know More →","flush-mount-album")}`],[`Enhance Your Memories With Lay Flat Albums`,`Lay Flat wedding photo albums and books from Ultraa Album are beautifully crafted and designed to preserve your wedding memories. Unlike traditional photo albums, they are more durable and prevent bending and creasing since the pages lay flat. Their price is lower than flush mount albums. You can display your images seamlessly thanks to their flat and panoramic pages. We offer several types of covers, from classic canvas to elegant acrylic-crystal. You’ll get vivid images with high-density colors. Personalized albums can be created to perfectly reflect the style and elegance of your event with a variety of cover options. Ready to order?<br><br>${a("Know More →","layflat")}`],[`Luxury Albums For Wedding Photo Albums Collection`,`Your most precious wedding memories are cherished in these meticulously crafted albums. They are crafted from carefully crafted leather and encased in a wood casket, offering a safe and refined home for your treasured memories. There is a choice of acrylic and leather album covers, as well as hardcovers, linen, wood, and canvas. Your marriage album design and layout can be personalized, even with your name or a special message. Taking a look at these albums will bring back memories of your wedding day that will last a lifetime.<br><br>${a("Know More →","luxury-albums")}`],[`Wedding Photo Books - Treasure Every Moment`,`Discover an array of versatile wedding photo albums by Ultraa Albums. These elegant albums are designed to preserve cherished moments, making them ideal for showcasing your wedding photography. With options for high-quality printing, tear-resistant paper, and unique finishes, these albums cater to various preferences. Available in different styles and sizes, from compact to coffee table hardcovers, they ensure your wedding memories are beautifully captured. Customization is key, with choices including acrylic-crystal, canvas, linen, leather, and more for covers. Imprint your love story in these albums that combine quality and personalization for lasting memories.<br><br>${a("Know More →","photo-book")}`],[`Discover Your Perfect Album or Book`,`Step into the enchanting world of Ultraa Albums’ wedding photo books and albums. Each piece is meticulously crafted to embrace your dearest wedding memories. These albums, delicately bound in handcrafted leather and encased in a wooden sanctuary, offer a secure and elegant haven for your treasured moments. Customization is at your fingertips, from the cover’s material, whether acrylic, leather, hardcover, linen, wood, or canvas, to your unique marriage album design and personal touches. These albums become your gateway to reliving the enchantment of your wedding day, preserving the magic of that special occasion.`]],map:1},
"blogs":{t:"Our Blogs",p:[`Are you looking for anyone who can do retouching for your photographs as per your convenience? Don’t hesitate, just call us. We have a team of highly skilled & expert professionals who can give you the best photo editing services. We are one of the leading album designing and manufacturing companies in India, situated in Mumbai.`],note:"Individual blog posts are listed on the live blog.",ext:["Read the live blog","https://ultraaalbums.com/blogs/"]},
"faq":{t:"Frequently Asked Questions",p:["A few helpful details about ordering, album design, materials and delivery. For a personalised price list, share your requirements with our team."],fq:[["How do I get a price list?","Fill up the enquiry form and mention your requirements in detail. The team will share a price list in reply, in your currency."],["Can I get help with album designing?","Yes. Ultraa Albums has a team of experienced professional album designers. The team shares a soft-copy preview for corrections and approval, with revisions until you are satisfied."],["Are the albums handmade?","Ultraa Albums says its flush mount albums are hand-bound using traditional bookbinding techniques."],["Which cover materials are available?","Cover options described on the website include acrylic-crystal, canvas, linen, leather, photo, metal and wood, with embossed finishes."],["Do you ship internationally?","The website describes service for clients in India and internationally, including the United States, United Kingdom, New Zealand, Canada and Europe."],["How can I contact the team?","Use the contact form, call +91-93222 54315, or email ultraaalbums@gmail.com."]]},
"privacy-policy":{t:"Privacy Policy",p:[`This privacy policy will help you understand how Ultraa Albums uses and protects the data you provide to us when you visit and use www.ultraaalbums.com`],h:`<p>We reserve the right to change this policy at any given time, of which you will be promptly updated. If you want to make sure that you are up to date with the latest changes, we advise you to frequently visit this page.</p><h3>What User Data We Collect</h3><p>When you visit the website, we may collect the following data:</p><ul><li>Your IP address.</li><li>Your contact information and email address.</li><li>Other information such as interests and preferences.</li><li>Data profile regarding your online behavior on our website.</li></ul><h3>Why We Collect Your Data</h3><ul><li>To better understand your needs.</li><li>To improve our services and products.</li><li>To send you promotional emails containing the information we think you will find interesting.</li><li>To contact you to fill out surveys and participate in other types of market research.</li><li>To customize our website according to your online behavior and personal preferences.</li></ul><h3>Safeguarding and Securing the Data</h3><p>Ultraa Albums is committed to securing your data and keeping it confidential. Ultraa Albums has done all in its power to prevent data theft, unauthorized access, and disclosure by implementing the latest technologies and software, which help us safeguard all the information we collect online.</p><h3>Our Cookie Policy</h3><p>Once you agree to allow our website to use cookies, you also agree to use the data it collects regarding your online behavior (analyze web traffic, web pages you spend the most time on, and websites you visit). The data we collect by using cookies is used to customize our website to your needs. After we use the data for statistical analysis, the data is completely moved from our systems. Please note that cookies don’t allow us to gain control of your computer in any way. They are strictly used to monitor which pages you find useful and which you do not so that we can provide a better experience for you. If you want to disable cookies, you can do it by accessing the settings of your internet browser.</p><h3>Links to Other Websites</h3><p>Our website contains links that lead to other websites. If you click on these links Ultraa Albums is not held responsible for your data and privacy protection. Visiting those websites is not governed by this privacy policy agreement. Make sure to read the privacy policy documentation of the website you go to from our website.</p><h3>Restricting the Collection of your Personal Data</h3><p>At some point, you might wish to restrict the use and collection of your personal data. You can achieve this by doing the following:</p><ul><li>When you are filling the forms on the website, make sure to check if there is a box which you can leave unchecked, if you don’t want to disclose your personal information.</li><li>If you have already agreed to share your information with us, feel free to contact us via email and we will be more than happy to change this for you.</li></ul><p>Ultraa Albums will not lease, sell or distribute your personal information to any third parties, unless we have your permission. We might do so if the law forces us. Your personal information will be used when we need to send you promotional materials if you agree to this privacy policy.</p>`},
"terms-and-condition":{t:"Terms and Conditions",p:[`Website Terms and Services Agreement`],h:`<p>The Website Terms & Conditions is a legal document that details the terms and conditions that the user must abide by while using the website. The website terms and conditions agreement details the license of the copyright in the website, includes a disclaimer of liability, an acceptable use clause, a variation clause, a clause specifying the applicable law and jurisdiction and other legal information.</p><h3>Usage</h3><p>This website terms and conditions document can be used by any website that is a blog or website or website offering services to the public or by an ecommerce website. All websites can use this to indicate to readers and users of their website the legal conditions that restrict the use of information and any other sensitive data or details displayed on the website.</p><h3>Execution</h3><p>This Website Terms & Conditions can be displayed on the website in a prominent place at the footer of the website. This indicates to customers and readers of the website the legal restrictions on the use of information available on that website.</p>`}

/* lightbox */
const LB=$("#lb"),LI=LB.querySelector("img");let lbs=[],li=0;

LB.addEventListener("click",e=>{if(e.target.closest(".lb-p"))lbShow(li-1);else if(e.target.closest(".lb-n"))lbShow(li+1);else if(e.target!==LI)lbClose()});
